# Padrões do Lumo. Valem como default do jogo; o jogador ainda pode
# sobrescrever qualquer um destes nas configurações do cliente.

# Nada de dano, morte ou combate: o jogo é de construção.
enable_damage = false
enable_pvp = false

# Fogo não se alastra (uma construção de madeira nunca some sozinha).
enable_fire = false

# TNT desativado.
enable_tnt = false
